spring.datasource.url=jdbc:postgresql://localhost:5432/continuum
spring.datasource.username=continuum
spring.datasource.password=continuum

# Each write/automation slice's build skill adds one line here of the form
# slices.{context}.write.{slicename}.enabled=false (or slices.{context}.automation.{slicename}.enabled=false)
# so fast unit tests never boot a real UmaDbClient/EventDispatcher. A Testcontainers-based
# end-to-end test (see build-state-view's reference) overrides these back to true for itself.

slices.blueprint.write.registeritem.enabled=false
slices.blueprint.write.activateitem.enabled=false
slices.blueprint.write.openlocation.enabled=false
slices.blueprint.automation.activateregistereditem.enabled=false
slices.blueprint.automation.activateitemsatopenedlocation.enabled=false
slices.blueprint.translation.facilitysitestatus.enabled=false
slices.blueprint.translation.reportitemtoassetregistry.enabled=false

# Spring Modulith (test-only, verification): every slices/<context> package is its own module
spring.modulith.detection-strategy=io.continuum.architecture.SliceContextModuleDetection
