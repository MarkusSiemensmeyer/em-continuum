spring.application.name=Continuum
spring.threads.virtual.enabled=true

umadb.host=localhost
umadb.port=50051

spring.datasource.url=jdbc:postgresql://localhost:5432/continuum
spring.datasource.username=continuum
spring.datasource.password=continuum
spring.jpa.hibernate.ddl-auto=update

spring.docker.compose.enabled=true
spring.docker.compose.file=docker-compose.yml

# Each write/automation slice's build skill adds one line here of the form
# slices.{context}.write.{slicename}.enabled=true (or slices.{context}.automation.{slicename}.enabled=true)
# - see build-kit/CLAUDE.md's feature-flag convention.

slices.blueprint.write.registeritem.enabled=true
slices.blueprint.write.activateitem.enabled=true
slices.blueprint.write.openlocation.enabled=true
slices.blueprint.automation.activateregistereditem.enabled=true
slices.blueprint.automation.activateitemsatopenedlocation.enabled=true
slices.blueprint.translation.facilitysitestatus.enabled=true
# Outbound translation to the external asset registry - off until a registry is reachable at the URL
# below; otherwise every ItemActivated logs a failed delivery (and is retried on the next start).
slices.blueprint.translation.reportitemtoassetregistry.enabled=false
blueprint.asset-registry.url=http://localhost:8089
